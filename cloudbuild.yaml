# Google Cloud Build Pipeline for NebulaX Rail Corrugation Condition Monitoring
steps:
  # 1. Fetch pre-staged application package from GCS
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gsutil'
    args: ['cp', 'gs://qwiklabs-gcp-01-c57489cc9b86_cloudbuild/source.tar.gz', 'source.tar.gz']

  # 2. Unpack application files
  - name: 'ubuntu'
    args: ['tar', '-xzf', 'source.tar.gz']

  # 3. Build Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/nebula-rail-twin:latest', '.']
  
  # 4. Push image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/nebula-rail-twin:latest']
  
  # 5. Deploy to Google Cloud Run (Asia Southeast 1 - Singapore)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nebula-rail-twin'
      - '--image'
      - 'gcr.io/$PROJECT_ID/nebula-rail-twin:latest'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/nebula-rail-twin:latest'

options:
  logging: CLOUD_LOGGING_ONLY
